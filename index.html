<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo-mark.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0EA5E9" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Orbyva" />
    <link rel="apple-touch-icon" href="/pwa-192.png" />
    <link
      rel="apple-touch-startup-image"
      href="/pwa-maskable-512.png"
      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"
    />
    <title>Orbyva — Saiba o que cabe no mês e organize o resto da vida</title>
    <meta name="description" content="Orçamento com teto, parcelas sob controle e lançamentos — com hábitos, metas, viagens, cinema e veículos na mesma órbita. 7 dias grátis." />
    <link rel="canonical" href="https://orbyva.app/" />
    <link rel="describedby" href="https://orbyva.app/llms.txt" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orbyva" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://orbyva.app/" />
    <meta property="og:title" content="Orbyva — Saiba o que cabe no mês" />
    <meta property="og:description" content="Orçamento, parcelas e lançamentos — com hábitos, metas, viagens e cinema no mesmo app." />
    <meta property="og:image" content="https://orbyva.app/marketing/hub.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Orbyva — Saiba o que cabe no mês" />
    <meta name="twitter:description" content="Orçamento, parcelas e lançamentos — com hábitos, metas, viagens e cinema no mesmo app." />
    <meta name="twitter:image" content="https://orbyva.app/marketing/hub.png" />

    <!-- FCP/LCP sem JS. Sem scripts inline (CSP script-src 'self'). -->
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #070b14;
        color: #fafafa;
      }
      /* Fora do fluxo: não empurra o React e não zera o LCP (display:none no img). */
      #boot {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        /* Acima do main (z-10); abaixo do header (z-20). z-5 ficava atrás do slot preto. */
        z-index: 15;
        padding: 1.25rem 1.25rem 0;
        pointer-events: none;
      }
      #boot[hidden] { display: none; }
      #boot-wordmark[hidden] { display: none; }
      .boot-wordmark {
        margin: 0;
        font: 700 1.35rem/1.2 system-ui, -apple-system, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .boot-wordmark span { color: #38bdf8; }
      .boot-lcp {
        position: fixed;
        top: 0;
        left: 0;
        display: block;
        width: min(220px, 62vw);
        height: auto;
        margin: 0;
        border-radius: 1.75rem;
        border: 3px solid #27272a;
        background: #09090b;
        transform: translate3d(calc(50vw - min(110px, 31vw)), 4.5rem, 0);
        will-change: transform;
      }
      .boot-lcp.boot-lcp-pinned {
        border: 0;
      }
    </style>
    <link
      rel="preload"
      as="image"
      href="/marketing/hub.webp"
      type="image/webp"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="boot">
      <p id="boot-wordmark" class="boot-wordmark"><span>O</span>RBYV<span>Ʌ</span></p>
      <img
        id="boot-lcp"
        class="boot-lcp"
        src="/marketing/hub.webp"
        alt="Início: saldo do mês, alertas e resumo do dia"
        width="390"
        height="843"
        fetchpriority="high"
        decoding="sync"
      />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
