      media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)"

    <meta name="description" content="Orçamento com teto, parcelas sob controle e lançamentos — com hábitos, metas, viagens, cinema e veículos na mesma órbita. 7 dias grátis." />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Orbyva" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://orbyva.app/" />

    <!-- FCP sem JS. Sem scripts inline (CSP script-src 'self'). -->
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        background: #070b14;
      }
      /* Wordmark só no first paint; o React esconde #boot ao hidratar. */
      #boot {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        z-index: 15;
        pointer-events: none;
      }
      #boot[hidden] { display: none; }
      .boot-wordmark {
        margin: 0;
        padding: 1.25rem;
        color: #fafafa;
        font: 700 1.35rem/1.2 system-ui, -apple-system, sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      .boot-wordmark span { color: #38bdf8; }
    </style>
    <link
      rel="preload"
      as="image"
      href="/marketing/hub.webp"
      type="image/webp"
      fetchpriority="high"
    />
  </head>
  <body>
    <div id="boot">
      <p class="boot-wordmark"><span>O</span>RBYV<span>Ʌ</span></p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
