    <script>
      // Preload LCP só na home — evita puxar hub nas outras rotas do SPA.
      if (location.pathname === "/" || location.pathname === "") {
        var l = document.createElement("link");
        l.rel = "preload";
        l.as = "image";
        l.href = "/marketing/hub.webp";
        l.type = "image/webp";
        l.fetchPriority = "high";
        document.head.appendChild(l);
      }
    </script>
