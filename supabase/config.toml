# Apenas overrides necessários. project_id vem do `supabase link`.
# (A seção [project] antiga quebra o CLI recente.)

# Stripe envia o webhook sem JWT do Supabase — desligar verificação no gateway.
[functions.stripe-webhook]
verify_jwt = false

# Cron diário (Authorization: Bearer CRON_SECRET) — sem JWT de usuário.
[functions.retention-d7-email]
verify_jwt = false

[functions.weekly-digest-email]
verify_jwt = false

[functions.lifecycle-email]
verify_jwt = false

[functions.habit-reminder-email]
verify_jwt = false

[functions.waitlist-email]
verify_jwt = false

# Auth Hook Send Email (assinatura Standard Webhooks).
[functions.auth-send-email]
verify_jwt = false
