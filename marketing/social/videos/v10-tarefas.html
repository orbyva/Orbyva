<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="duration" content="8">
<title>V10 · Tarefas</title>
<link rel="stylesheet" href="../lib/orbyva.css">
<link rel="stylesheet" href="../lib/anim.css">
</head>
<body>

<div class="stage stage--story s-paper" data-eyebrow="Tarefas" data-module="productivity" data-sig="br">
  <div class="scenes">

    <div class="swap">
      <div class="head head--sm a" style="--d:.15s; --x:5.45s">O que você<br>faz <span style="color:var(--m-productivity)">hoje</span>?</div>
      <div class="head head--sm a" style="--d:6.70s">Lista. Kanban.<br>Gantt. Agenda.</div>
    </div>

    <div class="card a" style="--d:2.10s; padding:16px 38px">
      <div class="ui-label" style="padding:18px 4px 8px; color:var(--m-productivity)">Hoje</div>
      <div class="row a" style="--in:k-right; --d:2.40s">
        <div class="f1">
          <div class="ui-name" style="font-size:32px">Revisar orçamento</div>
          <div class="ui-cap" style="font-size:24px; margin-top:6px">A fazer · Finanças</div>
        </div>
      </div>
      <div class="row a" style="--in:k-right; --d:2.58s">
        <div class="f1">
          <div class="ui-name" style="font-size:32px">Pauta da reunião</div>
          <div class="ui-cap" style="font-size:24px; margin-top:6px">Fazendo · 45 min</div>
        </div>
      </div>
      <div class="ui-label a" style="padding:10px 4px 8px; --d:3.10s">Esta semana</div>
      <div class="row a" style="--in:k-right; --d:3.30s">
        <div class="f1">
          <div class="ui-name" style="font-size:32px">Ligar para o pedreiro</div>
          <div class="ui-cap" style="font-size:24px; margin-top:6px">A fazer · Obra</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="../lib/kit.js"></script>
</body>
</html>
