<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="duration" content="8">
<title>V15 · Conteúdo</title>
<link rel="stylesheet" href="../lib/orbyva.css">
<link rel="stylesheet" href="../lib/anim.css">
</head>
<body>

<div class="stage stage--story s-ink" data-eyebrow="Conteúdo" data-module="cinema" data-sig="br">
  <div class="scenes">

    <div class="swap">
      <div class="head head--sm a" style="--d:.15s; --x:6.20s">Aquele filme<br>que você <span style="color:var(--m-cinema)">amou</span>?</div>
      <div class="head head--sm a" style="--d:6.60s">Está aqui,<br>com <span style="color:var(--m-cinema)">nota</span>.</div>
    </div>

    <!-- Cinema, Livros e Música: o mesmo jeito de listar e dar nota -->
    <div class="card a" style="--d:1.40s; padding:34px 38px 38px">
      <div class="lcol" style="--m:var(--m-cinema)">
        <h3>Cinema</h3>
        <div class="it a" style="--in:k-right; --d:1.90s">
          <div class="f1"><div class="nm">Duna: Parte 2</div><div class="ct">Assistidos</div></div>
          <span class="stars" data-stars="4"></span>
        </div>
        <div class="it a" style="--in:k-right; --d:2.10s">
          <div class="f1"><div class="nm">Severance</div><div class="ct">Assistindo · T2E5</div></div>
        </div>
      </div>

      <hr class="hair a" style="--in:k-fade; --d:2.70s; margin:28px 0">

      <div class="lcol a" style="--m:var(--m-cinema); --in:k-fade; --d:2.90s">
        <h3>Livros</h3>
        <div class="it">
          <div class="f1"><div class="nm">Torto Arado</div><div class="ct">Lidos</div></div>
          <span class="stars" data-stars="5"></span>
        </div>
        <div class="it">
          <div class="f1"><div class="nm">Sapiens</div><div class="ct">Lendo · pág. 214</div></div>
        </div>
      </div>

      <hr class="hair a" style="--in:k-fade; --d:3.70s; margin:28px 0">

      <div class="lcol a" style="--m:var(--m-cinema); --in:k-fade; --d:3.90s">
        <h3>Música</h3>
        <div class="it">
          <div class="f1"><div class="nm">Clube da Esquina</div><div class="ct">Ouvidos</div></div>
          <span class="stars" data-stars="5"></span>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="../lib/kit.js"></script>
</body>
</html>
