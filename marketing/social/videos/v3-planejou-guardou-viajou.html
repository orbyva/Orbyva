<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="duration" content="9">
<title>V3 · Planejou. Guardou. Viajou.</title>
<link rel="stylesheet" href="../lib/orbyva.css">
<link rel="stylesheet" href="../lib/anim.css">
</head>
<body>

<div class="stage stage--story s-ink" data-eyebrow="Uma órbita" data-sig="br">
  <div class="scenes">

    <!-- as três palavras acumulam na tela -->
    <div class="col g6">
      <div class="head head--sm a" style="--d:.20s">Planejou.</div>
      <div class="head head--sm a" style="--d:3.10s">Guardou.</div>
      <div class="head head--sm a acc" style="--d:6.10s">Viajou.</div>
    </div>

    <!-- o módulo correspondente a cada palavra, no mesmo lugar -->
    <div class="swap swap--top" style="min-height:300px">

      <div class="a" style="--d:.95s; --x:2.85s">
        <span class="mchip" style="--m:var(--m-life)">Metas</span>
        <div class="card" style="margin-top:22px; padding:30px 34px">
          <div class="ui-name">Japão 2027</div>
          <div class="rowf jb" style="margin-top:20px">
            <span class="ui-cap" style="font-size:24px">R$ 2.800 / R$ 14.000</span>
            <span class="ui-cap tnum" style="font-size:24px">20%</span>
          </div>
          <div class="bar" style="margin-top:12px"><i class="a" style="--p:20%; --d:1.35s"></i></div>
        </div>
      </div>

      <div class="a" style="--d:3.55s; --x:5.85s">
        <span class="mchip" style="--m:var(--m-finance)">Recorrências</span>
        <div class="card" style="margin-top:22px; padding:30px 34px">
          <div class="ui-name">Aporte · Japão 2027</div>
          <div class="ui-cap" style="font-size:24px; margin-top:12px">Parcelada (16x) · R$ 700,00 / mês</div>
          <div class="rowf jb" style="margin-top:20px">
            <span class="ui-cap" style="font-size:24px">R$ 14.000 / R$ 14.000</span>
            <span class="ui-cap tnum" style="font-size:24px">100%</span>
          </div>
          <div class="bar" style="margin-top:12px"><i class="ok a" style="--p:100%; --d:3.95s; --dur:1.1s"></i></div>
        </div>
      </div>

      <div class="a" style="--d:6.55s">
        <span class="mchip" style="--m:var(--m-travel)">Viagens</span>
        <div class="card" style="margin-top:22px; padding:26px 30px">
          <div class="day now" style="border:0; background:transparent; padding:0">
            <span class="tile"><b>14</b><s>Seg</s></span>
            <div class="f1">
              <div class="ui-name">Kyoto · Higashiyama</div>
              <div class="ui-cap" style="font-size:23px; margin-top:8px">Dia 1 de 12 · 4 atividades</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="../lib/kit.js"></script>
</body>
</html>
