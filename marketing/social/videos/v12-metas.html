<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="duration" content="8">
<title>V12 · Metas</title>
<link rel="stylesheet" href="../lib/orbyva.css">
<link rel="stylesheet" href="../lib/anim.css">
</head>
<body>

<div class="stage stage--story s-paper" data-eyebrow="Metas" data-module="life" data-sig="br">
  <div class="scenes">

    <div class="swap">
      <div class="head head--sm a" style="--d:.15s; --x:6.20s">Guardar dinheiro<br>sem <span class="acc">meta</span>?</div>
      <div class="head head--sm a" style="--d:6.60s">Com meta,<br>ele <span class="acc">chega</span>.</div>
    </div>

    <!-- cards de Meta (Goals.tsx): progresso enchendo e aporte do mês -->
    <div class="card a" style="--d:1.40s; padding:36px 40px 40px">
      <span class="chip chip--mut" style="padding:8px 18px; font-size:22px">Viagem</span>
      <div class="ui-name" style="margin-top:20px; font-size:38px">Japão 2027</div>
      <div class="rowf jb" style="margin-top:28px">
        <span class="ui-cap tnum" style="font-size:26px">
          R$ <span data-count="8400" data-count-fmt="int" style="--d:2.20s; --dur:1.4s"></span> / R$ 14.000
        </span>
        <span class="ui-cap tnum" style="font-size:26px">
          <span data-count="60" data-count-fmt="pct" style="--d:2.20s; --dur:1.4s"></span>
        </span>
      </div>
      <div class="bar" style="margin-top:14px"><i class="a" style="--p:60%; --d:2.20s; --dur:1.4s"></i></div>
      <div class="ui-cap" style="font-size:24px; margin-top:18px">Prazo: mar/2027</div>

      <div class="a" style="--d:3.90s; margin-top:26px; padding:24px 26px; border-radius:16px;
                  border:2px solid rgba(14,165,233,.28); background:rgba(14,165,233,.08)">
        <div class="ui-cap" style="font-size:23px; color:var(--sky)">Aporte deste mês</div>
        <div class="ui-num ui-num--sm" style="margin-top:6px">R$ 700,00</div>
      </div>
    </div>

    <div class="card a" style="--d:4.60s; padding:30px 40px 34px">
      <div class="rowf jb ac">
        <div class="ui-name" style="font-size:32px">Reserva de emergência</div>
        <span class="ui-cap tnum" style="font-size:26px">90%</span>
      </div>
      <div class="bar bar--thin" style="margin-top:16px"><i class="a ok" style="--p:90%; --d:4.90s; --dur:1.1s"></i></div>
    </div>

  </div>
</div>

<script src="../lib/kit.js"></script>
</body>
</html>
