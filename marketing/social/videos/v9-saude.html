<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="duration" content="8">
<title>V9 · Saúde</title>
<link rel="stylesheet" href="../lib/orbyva.css">
<link rel="stylesheet" href="../lib/anim.css">
</head>
<body>

<div class="stage stage--story s-ink" data-eyebrow="Saúde" data-module="health" data-sig="br">
  <div class="scenes">

    <div class="swap">
      <div class="head head--sm a" style="--d:.15s; --x:5.45s">A próxima dose<br>não pode depender<br>da memória.</div>
      <div class="head head--sm a" style="--d:6.70s">Tudo em<br><span style="color:var(--m-health)">Saúde</span>.</div>
    </div>

    <div class="card a" style="--d:2.20s; padding:36px 40px">
      <div class="ui-label" style="color:var(--m-health)">Medicações</div>
      <div class="ui-cap" style="margin-top:18px">Próxima dose</div>
      <div class="ui-name" style="margin-top:8px; font-size:36px">Losartana 50 mg</div>
      <div class="ui-cap" style="margin-top:8px; font-size:26px">Hoje, 08:00</div>
      <hr class="hair" style="margin:28px 0">
      <div class="rowf ac">
        <span class="ui-cap" style="font-size:26px">Adesão 30 dias</span>
        <span class="ui-num ui-num--xs tnum" style="margin-left:auto; font-size:40px">
          <span data-count="92" data-count-fmt="pct" style="--d:3.40s; --dur:1.1s"></span>
        </span>
      </div>
    </div>

    <div class="rowf wrap g16">
      <span class="chip chip--mut a" style="--in:k-right; --d:4.80s; font-size:26px; padding:14px 26px">Consultas</span>
      <span class="chip chip--mut a" style="--in:k-right; --d:5.00s; font-size:26px; padding:14px 26px">Progresso</span>
      <span class="chip chip--mut a" style="--in:k-right; --d:5.20s; font-size:26px; padding:14px 26px">Lembretes</span>
    </div>

  </div>
</div>

<script src="../lib/kit.js"></script>
</body>
</html>
