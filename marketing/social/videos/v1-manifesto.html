<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="duration" content="10">
<title>V1 · Manifesto</title>
<link rel="stylesheet" href="../lib/orbyva.css">
<link rel="stylesheet" href="../lib/anim.css">
</head>
<body>

<div class="stage stage--story s-ink" data-eyebrow="Life OS" data-sig="br">
  <div class="scenes">
    <div class="swap">

      <!-- 0.0–3.2 · a provocação, em três blocos -->
      <div>
        <div class="head head--sm a" style="--d:.15s; --x:2.9s">Sua vida</div>
        <div class="head head--sm a" style="--d:.45s; --x:2.94s">não cabe em</div>
        <div class="head head--sm a acc" style="--d:.75s; --x:2.98s">10 aplicativos.</div>
      </div>

      <!-- 3.2–6.6 · os módulos entram um a um -->
      <div class="rowf wrap g20" style="align-content:center; align-self:center">
        <span class="mchip a" style="--m:var(--m-finance); --in:k-right; --d:3.35s; --x:6.20s; font-size:40px">Finanças</span>
        <span class="mchip a" style="--m:var(--m-productivity); --in:k-right; --d:3.52s; --x:6.22s; font-size:40px">Tarefas</span>
        <span class="mchip a" style="--m:var(--m-health); --in:k-right; --d:3.69s; --x:6.24s; font-size:40px">Saúde</span>
        <span class="mchip a" style="--m:var(--m-life); --in:k-right; --d:3.86s; --x:6.26s; font-size:40px">Hábitos</span>
        <span class="mchip a" style="--m:var(--m-life); --in:k-right; --d:4.03s; --x:6.28s; font-size:40px">Metas</span>
        <span class="mchip a" style="--m:var(--m-travel); --in:k-right; --d:4.20s; --x:6.30s; font-size:40px">Viagens</span>
        <span class="mchip a" style="--m:var(--m-productivity); --in:k-right; --d:4.37s; --x:6.32s; font-size:40px">Notas</span>
      </div>

      <!-- 6.6–10.0 · fecho de marca -->
      <div class="col g36">
        <div class="a" style="--in:k-scale; --d:6.70s; --s0:.88"><div data-mark style="height:190px"></div></div>
        <div class="head head--sm a" style="--d:7.05s">Organize sua vida.<br><span class="acc">Do seu jeito.</span></div>
        <div class="a" style="--d:7.65s"><span class="cta cta--lg">orbyva.app<span data-icon="arrow"></span></span></div>
      </div>

    </div>
  </div>
</div>

<script src="../lib/kit.js"></script>
</body>
</html>
