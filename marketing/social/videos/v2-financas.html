<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="duration" content="7">
<title>V2 · Finanças</title>
<link rel="stylesheet" href="../lib/orbyva.css">
<link rel="stylesheet" href="../lib/anim.css">
</head>
<body>

<div class="stage stage--story s-ink" data-eyebrow="Finanças" data-module="finance" data-sig="br">
  <div class="scenes">

    <!-- pergunta e resposta no mesmo lugar da tela -->
    <div class="swap">
      <div class="head head--sm a" style="--d:.15s; --x:2.15s">Quanto você<br>gastou este mês?</div>
      <div class="head head--sm a" style="--d:5.10s">O Orbyva<br><span class="acc">sabe</span>.</div>
    </div>

    <!-- card de Finanças do Início, com o valor contando -->
    <div class="card card--sky a" style="--d:2.50s; --dur:.7s; padding:44px 48px 48px">
      <div class="ui-label">Lançamentos · Agosto/2026</div>
      <div class="ui-cap" style="color:rgba(255,255,255,.78); margin-top:26px">Despesas</div>
      <div class="ui-num" style="margin-top:8px; font-size:78px; --d:2.80s; --dur:1.05s"
           data-count="3412.90" data-count-fmt="brl"></div>
      <hr class="hair" style="margin:34px 0 32px">
      <div class="rowf">
        <div class="f1">
          <div class="ui-label">Receitas</div>
          <div class="ui-num ui-num--sm" style="margin-top:12px; font-size:42px">R$ 9.000,00</div>
        </div>
        <div class="f1">
          <div class="ui-label">Saldo do mês</div>
          <div class="ui-num ui-num--sm" style="margin-top:12px; font-size:42px">R$ 5.587,10</div>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="../lib/kit.js"></script>
</body>
</html>
