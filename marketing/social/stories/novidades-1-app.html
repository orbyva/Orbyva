<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Novidades · App nas lojas</title>
<link rel="stylesheet" href="../lib/orbyva.css">
<style>
  .hero-icon {
    position: relative;
    align-self: center;
    width: 640px;
    height: 640px;
    display: grid;
    place-items: center;
  }
  .hero-icon .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px dashed rgba(56, 189, 248, 0.5);
    transform: rotate(-18deg) scaleY(0.42);
  }
  .hero-icon .ring--in {
    inset: 90px;
    border: 2px solid rgba(56, 189, 248, 0.25);
  }
  .hero-icon .glow {
    position: absolute;
    width: 420px;
    height: 420px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(14, 165, 233, 0.45), transparent 65%);
    filter: blur(20px);
  }
  .logo {
    position: relative;
    width: 360px;
    height: auto;
    filter: drop-shadow(0 20px 50px rgba(14, 165, 233, 0.55));
  }
  /* satélites na órbita: cada plataforma "orbita" o app */
  /* centros nas pontas da órbita externa: ±304px em x, ∓99px em y (raio 320, -18°) */
  .sat {
    position: absolute;
    width: 120px;
    height: 120px;
    border-radius: 32px;
    display: grid;
    place-items: center;
    background: #18181b;
    border: 2px solid rgba(255, 255, 255, 0.12);
    box-shadow: 0 24px 50px -20px rgba(0, 0, 0, 0.9);
  }
  .sat svg { width: 62px; height: 62px; }
  .sat--apple { left: -44px; top: 359px; }
  .sat--android { left: 564px; top: 161px; }

  .platforms {
    display: flex;
    gap: 24px;
  }
  .plat {
    flex: 1;
    display: flex;
    align-items: center;
    gap: 26px;
    padding: 30px 32px;
    border-radius: 28px;
    border: 2px solid var(--surf-line);
    background: var(--surf);
  }
  .plat svg {
    flex: none;
    width: 72px;
    height: 72px;
  }
  .plat div {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .plat b {
    font-weight: 700;
    font-size: 38px;
    letter-spacing: -0.01em;
    line-height: 1;
  }
  .plat span {
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--acc);
  }
  .apple { fill: #fff; }
  .android { fill: #3ddc84; }
</style>
</head>
