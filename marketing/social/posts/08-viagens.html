<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P08 · Viagens</title>

</head>
<body>

<div class="stage stage--feed s-ink" data-eyebrow="Viagens" data-module="travel" data-idx="08/16"
     data-sig="tr" data-cta="Planeje a próxima">

  <h1 class="head head--sm" style="margin-top:54px">
    Planeje a viagem<br>inteira em<br><span class="acc">um só lugar</span>.
  </h1>

  <p class="sub sub--wide" style="margin-top:28px">
    Roteiro por dia, Gastos, Lugares e Prazos na mesma viagem.
  </p>

  <div class="spacer"></div>

  <div class="tabs">
    <span class="on">Roteiro</span><span>Gastos</span><span>Lugares</span><span>Prazos</span>
  </div>

  <!-- dias do Roteiro (TripItineraryTab.tsx) -->
  <div class="col g16" style="margin-top:26px">

    <div class="day now">
      <span class="tile"><b>14</b><s>Seg</s></span>
      <div class="f1">
        <div class="ui-name">Kyoto · Higashiyama</div>
        <div class="rowf ac g16" style="margin-top:12px">
          <span class="bar bar--thin f1" style="max-width:220px"><i class="ok" style="--p:75%"></i></span>
          <span class="ui-cap tnum" style="font-size:20px">3/4</span>
          <span class="chip chip--ok" style="padding:6px 14px; font-size:18px">Hoje</span>
        </div>
      </div>
    </div>

    <div class="day">
      <span class="tile"><b>15</b><s>Ter</s></span>
      <div class="f1">
        <div class="ui-name">Kyoto → Osaka</div>
        <div class="ui-cap" style="font-size:21px; margin-top:8px">Trem · 09:40 → 10:28</div>
      </div>
    </div>

    <div class="day">
      <span class="tile"><b>16</b><s>Qua</s></span>
      <div class="f1">
        <div class="ui-name">Osaka · Namba</div>
        <div class="ui-cap" style="font-size:21px; margin-top:8px">5 atividades · 2 reservadas</div>
      </div>
    </div>

  </div>

  <div class="spacer"></div>

</div>

<script src="../lib/kit.js"></script>
