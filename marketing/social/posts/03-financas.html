<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P03 · Finanças</title>
<link rel="stylesheet" href="../lib/orbyva.css">
</head>
<body>

<div class="stage stage--feed s-ink" data-eyebrow="Finanças" data-module="finance" data-idx="03/12"
     data-sig="tr" data-cta="Veja o mês inteiro">

  <h1 class="head" style="margin-top:56px">
    Seu dinheiro,<br><span class="acc">organizado</span>.
  </h1>

  <p class="sub sub--wide" style="margin-top:30px">
    Transações, Categorias, Orçamento e Recorrências no mesmo módulo.
  </p>

  <div class="spacer"></div>

  <!-- card de Finanças do Início (HubLedgerHero.tsx) -->
  <div class="card card--sky" style="padding:40px 44px 44px">
    <div class="ui-label">Lançamentos · Agosto/2026</div>
    <div class="ui-cap" style="color:rgba(255,255,255,.78); margin-top:22px">Saldo do mês</div>
    <div class="ui-num" style="margin-top:6px">R$ 8.880,10</div>
    <div class="ui-cap" style="color:rgba(255,255,255,.7); margin-top:10px">Despesa ↓ 98% vs jul</div>
    <hr class="hair" style="margin:32px 0 30px">
    <div class="rowf">
      <div class="f1">
        <div class="ui-label">Receitas</div>
        <div class="ui-num ui-num--sm" style="margin-top:10px">R$ 9.000,00</div>
      </div>
      <div class="f1">
        <div class="ui-label">Despesas</div>
        <div class="ui-num ui-num--sm" style="margin-top:10px">R$ 119,90</div>
      </div>
    </div>
  </div>

  <div class="rowf wrap g16" style="margin-top:30px">
    <span class="chip chip--mut">Categorias</span>
    <span class="chip chip--mut">Orçamento</span>
    <span class="chip chip--mut">Recorrências</span>
    <span class="chip chip--mut">Transações</span>
  </div>

  <div class="spacer"></div>

</div>

<script src="../lib/kit.js"></script>
