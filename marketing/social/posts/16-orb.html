<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>P16 · Orb</title>
<link rel="stylesheet" href="../lib/orbyva.css">
</head>
<body>

<div class="stage stage--feed s-paper" data-eyebrow="Orb" data-module="orb" data-idx="16/16"
     data-sig="tr" data-cta="Converse com a Orb">

  <h1 class="head head--sm" style="margin-top:54px">
    Pergunte. A <span style="color:var(--m-orb)">Orb</span><br>responde com<br>os seus números.
  </h1>

  <p class="sub sub--wide" style="margin-top:28px; text-wrap:balance">
    A IA do Orbyva consulta o seu mês e só grava com o seu clique.
  </p>

  <div class="spacer"></div>

  <!-- OrbChat: cabeçalho, pergunta, resposta e cartão de proposta (OrbActionCard) -->
  <div class="card" style="padding:30px 34px 34px">
    <div class="rowf ac g20" style="padding-bottom:22px; border-bottom:2px solid var(--hair)">
      <span class="orb" style="--os:64px"></span>
      <div>
        <div class="ui-name">Orb</div>
        <div class="ui-cap" style="font-size:21px">Conectada ao seu Orbyva</div>
      </div>
    </div>

    <div class="col g16" style="margin-top:26px">
      <div class="bubble bubble--me" style="font-size:26px; padding:20px 26px">
        Quanto ainda posso gastar com lazer?
      </div>
      <div class="rowf g16" style="align-items:flex-start">
        <span class="orb" style="--os:36px; margin-top:8px"></span>
        <div class="bubble bubble--orb" style="font-size:26px; padding:20px 26px">
          Restam <b>R$ 182,40</b> em Lazer até o dia 31.
        </div>
      </div>
      <div class="rowf g16" style="align-items:flex-start">
        <span class="orb" style="--os:36px; margin-top:8px; visibility:hidden"></span>
        <div class="proposal f1" style="padding:22px 26px 24px">
          <div class="ui-label" style="font-size:19px">Novo lançamento</div>
          <div class="rowf jb ac" style="margin-top:10px">
            <span class="ui-name" style="font-size:27px">Cinema · Lazer</span>
            <span class="ui-num ui-num--xs">R$ 48,90</span>
          </div>
          <div class="rowf g12" style="margin-top:16px">
            <span class="btn" style="font-size:22px; padding:12px 24px">Confirmar</span>
            <span class="btn btn--ghost" style="font-size:22px; padding:12px 24px">Descartar</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="spacer"></div>

</div>

<script src="../lib/kit.js"></script>
</body>
</html>
