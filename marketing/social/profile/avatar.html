<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Foto de perfil</title>
<link rel="stylesheet" href="../lib/orbyva.css">
<style>
  /* O mark fica dentro da área segura circular (Instagram recorta em círculo). */
  .avatar {
    display: grid;
    place-items: center;
    background: #0b0f1a;
  }
  .avatar .ring {
    position: absolute;
    width: 1080px;
    height: 1080px;
    border-radius: 999px;
    box-shadow: inset 0 0 0 2px rgba(14, 165, 233, 0.16);
  }
  .avatar [data-mark] {
    height: 480px;
    color: var(--sky);
    filter: drop-shadow(0 0 70px rgba(14, 165, 233, 0.28));
  }
</style>
</head>
<body>

<div class="stage stage--square avatar s-ink" data-head="none" data-foot="none" data-sig="none">
  <span class="ring"></span>
  <div data-mark></div>
</div>

<script src="../lib/kit.js"></script>
</body>
</html>
